name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "components/**"
      - "devices/**"
      - "ci/**"
      - "mk/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "components/**"
      - "devices/**"
      - "ci/**"
      - "mk/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.resolve.outputs.components }}
      esphome_version: ${{ steps.resolve.outputs.esphome_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve components + ESPHome version
        id: resolve
        run: ci/scripts/resolve-ci-matrix.sh

  test:
    name: Unit tests (${{ matrix.component }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      - name: Run host tests
        run: make test COMPONENT=${{ matrix.component }}

  smoke:
    name: Smoke compile (${{ matrix.component }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      # Compile-only via the ESPHome image. Mount /cache so PlatformIO can write
      # when running as the Actions user (avoids Permission denied on /config).
      # Do not use esphome/build-action: it requires firmware.factory.bin, which
      # BK72xx/LibreTiny does not produce.
      - name: Pull ESPHome image
        run: docker pull "ghcr.io/esphome/esphome:${{ needs.setup.outputs.esphome_version }}"

      - name: Compile smoke config
        run: |
          mkdir -p "${RUNNER_TEMP}/esphome-cache"
          docker run --rm \
            --workdir /github/workspace \
            -v "$PWD":/github/workspace \
            -v "${RUNNER_TEMP}/esphome-cache:/cache" \
            -e HOME \
            -e PLATFORMIO_GLOBALLIB_DIR= \
            --user "$(id -u):$(id -g)" \
            "ghcr.io/esphome/esphome:${{ needs.setup.outputs.esphome_version }}" \
            compile "ci/smoke/${{ matrix.component }}.yml"

  package-version:
    name: Resolve package version
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [setup, test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version (vYY-M-N)
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [[ "${{ github.event_name }}" == "release" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(ci/scripts/next-version.sh)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$version"
            git push origin "refs/tags/$version"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${version}"

  package:
    name: Package (${{ matrix.component }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [setup, test, smoke, package-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build archive
        id: pack
        run: |
          set -euo pipefail
          archive=$(ci/scripts/package-component.sh \
            "${{ matrix.component }}" \
            "${{ needs.package-version.outputs.version }}")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-component
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.archive }}" \
            --clobber
