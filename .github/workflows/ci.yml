name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "components/**"
      - "devices/**"
      - "ci/**"
      - "mk/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "components/**"
      - "devices/**"
      - "ci/**"
      - "mk/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.resolve.outputs.components }}
      esphome_version: ${{ steps.resolve.outputs.esphome_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve components + ESPHome version
        id: resolve
        run: ci/scripts/resolve-ci-matrix.sh

  test:
    name: Unit tests (${{ matrix.component }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      - name: Run host tests
        run: make test COMPONENT=${{ matrix.component }}

  smoke:
    name: Smoke compile (${{ matrix.component }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      - name: Compile smoke config
        uses: esphome/build-action@v7.3.0
        with:
          yaml-file: ci/smoke/${{ matrix.component }}.yml
          version: ${{ needs.setup.outputs.esphome_version }}

  package:
    name: Package (${{ matrix.component }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [setup, test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.setup.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build archive
        id: pack
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" != "release" ]]; then
            version="sha-${GITHUB_SHA::7}"
          fi
          archive=$(ci/scripts/package-component.sh "${{ matrix.component }}" "$version")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-component
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.archive }}" \
            --clobber
